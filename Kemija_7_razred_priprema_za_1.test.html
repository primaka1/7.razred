<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kemija 7 – priprema za test</title>
<style>
:root{
  --bg:#fbf7ee;--card:#fffdf8;--ink:#1d2420;--muted:#5b625e;--line:#e3dccb;
  --accent:#1f6f8b;--accent-ink:#fff;--ok:#1e7a44;--okbg:#e4f4e9;--bad:#b3261e;--badbg:#fbe9e7;
  --star:#e0a100;--lock:#b9b2a2;--fs:21px;
}
:root[data-theme="dark"]{
  --bg:#1b1f1d;--card:#252a27;--ink:#f1efe8;--muted:#b8bdb9;--line:#3a413d;
  --accent:#6cc3e0;--accent-ink:#10181c;--ok:#7fd69f;--okbg:#1f3a2a;--bad:#ff8f86;--badbg:#3d2321;--star:#ffcf4d;--lock:#5c625e;
}
*{box-sizing:border-box}
html{font-size:var(--fs)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Verdana,"Atkinson Hyperlegible",Tahoma,sans-serif;line-height:1.6;letter-spacing:.01em}
button{font-family:inherit;font-size:1rem;cursor:pointer;border:0;border-radius:16px}
.app{max-width:640px;margin:0 auto;padding:16px 16px 40px;min-height:100vh;display:flex;flex-direction:column}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px}
.top h1{font-size:1.05rem;margin:0}
.tools{display:flex;gap:6px}
.tool{background:var(--card);color:var(--ink);border:2px solid var(--line);padding:6px 11px;font-size:.8rem;font-weight:700;min-height:44px;min-width:44px}
.card{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:22px 20px;margin:8px 0}
.big{font-size:1.15rem;margin:0 0 18px;font-weight:700}
.text{font-size:1.05rem;margin:0}
.text b{color:var(--accent)}
.muted{color:var(--muted);font-size:.85rem}
.btn{display:block;width:100%;background:var(--accent);color:var(--accent-ink);font-weight:700;padding:16px;margin-top:16px;min-height:60px}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.row{display:flex;gap:10px}.row .btn{flex:1}
.btn.listen{background:#5b3fa8;color:#fff;margin:0 0 10px}
:root[data-theme="dark"] .btn.listen{background:#b9a4ff;color:#1a1430}
.btn.sel{border-color:var(--accent);color:var(--accent)}
.btn:disabled{opacity:.35;cursor:default}
.card.playing{border-color:#5b3fa8}
.dots{display:flex;gap:7px;justify-content:center;margin:6px 0 4px;flex-wrap:wrap}
.dot{width:14px;height:14px;border-radius:50%;background:var(--line)}
.dot.on{background:var(--accent)}.dot.ok{background:var(--ok)}.dot.bad{background:var(--bad)}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);color:var(--ink);border:3px solid var(--line);padding:14px 16px;margin:10px 0;min-height:66px;line-height:1.4}
.opt .k{flex:0 0 36px;height:36px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.right{border-color:var(--ok);background:var(--okbg)}
.opt.right .k{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.opt.wrong .k{background:var(--bad);color:#fff;border-color:var(--bad)}
.opt:disabled{cursor:default}
.fb{border-radius:16px;padding:14px 16px;margin-top:6px;font-size:.95rem}
.fb.ok{background:var(--okbg);color:var(--ok)}.fb.bad{background:var(--badbg);color:var(--bad)}
.fb .ex{color:var(--ink);display:block;margin-top:4px}
.levels{display:grid;grid-template-columns:1fr;gap:10px}
.lvl{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);color:var(--ink);border:2px solid var(--line);padding:14px 16px;min-height:72px}
.lvl .n{flex:0 0 46px;height:46px;border-radius:14px;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-weight:700}
.lvl .t{flex:1;font-weight:700;font-size:.92rem;line-height:1.35}
.lvl .s{font-size:1rem;color:var(--star);letter-spacing:2px;white-space:nowrap}
.lvl.done{border-color:var(--ok)}
.stars{font-size:3rem;color:var(--star);text-align:center;letter-spacing:8px;margin:6px 0}
.center{text-align:center}
.combo{display:inline-block;background:var(--okbg);color:var(--ok);border-radius:999px;padding:2px 12px;font-size:.8rem;font-weight:700}
.timer{font-size:3rem;font-weight:700;text-align:center;color:var(--accent);margin:10px 0}
.speak{background:transparent;border:2px solid var(--line);color:var(--ink);padding:4px 12px;font-size:.8rem;min-height:44px;float:right;margin:-6px -4px 8px 10px}
.pill{display:inline-block;font-size:.75rem;font-weight:700;color:var(--muted);border:2px solid var(--line);border-radius:999px;padding:1px 10px;margin-bottom:10px}
.hud{position:sticky;top:0;z-index:4;display:flex;gap:8px;justify-content:space-between;background:var(--bg);padding:6px 0 10px;margin-bottom:4px}
.chip{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:6px 10px;font-weight:700;font-size:.9rem;min-height:46px;color:var(--ink)}
.chip .ic{font-size:1.15rem;line-height:1}
.fire .ic{filter:grayscale(1);opacity:.45;transition:transform .2s}
.fire.on .ic{filter:none;opacity:1}
.fire.t2 .ic{transform:scale(1.25)}.fire.t3 .ic{transform:scale(1.5)}
.fire.on{border-color:#f08a24}
:root{--coin:#1565c0}:root[data-theme="dark"]{--coin:#7cc4ff}
.coins{color:var(--coin)}
.float{position:fixed;left:50%;top:70px;transform:translateX(-50%);font-weight:700;font-size:1.3rem;color:var(--coin);pointer-events:none;z-index:20}
.toast{position:fixed;left:50%;top:10px;cursor:pointer;transform:translateX(-50%);width:min(92vw,520px);background:var(--card);border:3px solid var(--star);border-radius:20px;padding:14px 16px;display:flex;gap:14px;align-items:center;box-shadow:0 8px 30px rgba(0,0,0,.18);z-index:30}
.toast .bi{font-size:2.2rem;line-height:1}
.toast .tt{font-size:.75rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.toast .tn{font-weight:700}
.ach{display:grid;grid-template-columns:1fr;gap:10px}
.ac{display:flex;gap:14px;align-items:center;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px 14px}
.ac .bi{font-size:2rem;flex:0 0 44px;text-align:center}
.ac.locked .bi{filter:grayscale(1);opacity:.35}
.ac.locked .an{color:var(--muted)}
.ac.got{border-color:var(--star)}
.an{font-weight:700;font-size:.95rem}.ad{font-size:.82rem;color:var(--muted)}
@media(prefers-reduced-motion:no-preference){.float{animation:up 1s ease-out forwards}@keyframes up{from{opacity:1;top:90px}to{opacity:0;top:30px}}.toast{animation:pop .3s ease-out}@keyframes pop{from{opacity:0;transform:translate(-50%,20px)}to{opacity:1;transform:translate(-50%,0)}}}
@media(prefers-reduced-motion:no-preference){.card{animation:in .25s ease-out}@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <h1>🧪 Kemija 7</h1>
    <div class="tools">
      <button class="tool" onclick="fontSize(-1)" aria-label="Manja slova">A−</button>

</div>

{id:'perfect',i:'⭐',n:'Bez greške',d:'3 zvjezdice na jednoj razini',c:()=>G.perfect>=1},
{id:'perfect5',i:'🌟',n:'Zvjezdani niz',d:'3 zvjezdice na 5 razina',c:()=>Object.values(best).filter(x=>x===3).length>=5},
{id:'reader',i:'📘',n:'Knjiški moljac',d:'Pročitaj sve kartice jedne razine',c:()=>G.read.size>=1},
{id:'reader5',i:'📚',n:'Pametna glava',d:'Pročitaj kartice 5 razina',c:()=>G.read.size>=5},
{id:'r3',i:'🎒',n:'Zagrijavanje',d:'Završi 3 kruga',c:()=>G.rounds>=3},
{id:'r10',i:'🏃',n:'Upornost se isplati',d:'Završi 10 krugova',c:()=>G.rounds>=10},
{id:'safety',i:'🥽',n:'Sigurnost prije svega',d:'Barem 2 zvjezdice na razinama 4, 5 i 6',c:()=>[3,4,5].every(i=>lvlStars(i)>=2)},
{id:'states',i:'🧊',n:'Led, voda, para',d:'Barem 2 zvjezdice na razinama 9 i 10',c:()=>[8,9].every(i=>lvlStars(i)>=2)},
{id:'fixer',i:'🔧',n:'Majstor popravka',d:'Ispravi 5 krivih odgovora u popravku',c:()=>G.fixed>=5},
{id:'mix',i:'🌀',n:'Miješalica',d:'Završi miješani krug',c:()=>G.mix>=1},
{id:'bonus',i:'🎁',n:'Lovac na bonus',d:'Odigraj bonus razinu',c:()=>G.played.has(LEVELS.length-1)},
{id:'all',i:'🗺️',n:'Sve istraženo',d:'Odigraj svih '+NUM+' razina',c:()=>[...Array(NUM).keys()].every(i=>G.played.has(i))},
{id:'c100',i:'💎',n:'Prvi dijamanti',d:'Skupi 100 dijamanata',c:()=>G.coins>=100},
{id:'c500',i:'🧰',n:'Škrinja s blagom',d:'Skupi 500 dijamanata',c:()=>G.coins>=500},
{id:'c1000',i:'👑',n:'Dijamantna kruna',d:'Skupi 1000 dijamanata',c:()=>G.coins>=1000},
{id:'stars30',i:'🏆',n:'Majstor kemije',d:'Skupi 30 zvjezdica',c:()=>totalStars()>=30}
];
function hud(){
  document.getElementById('hCoins').textContent=G.coins;
  document.getElementById('hStreak').textContent=G.streak;
  document.getElementById('hAch').textContent=G.got.size+'/'+ACH.length;
  const f=document.getElementById('hFire');
  f.className='chip fire'+(G.streak>0?' on':'')+(G.streak>=10?' t3':G.streak>=5?' t2':'');
}
function addCoins(n,label){
  G.coins+=n;hud();
  const el=document.createElement('div');el.className='float';el.textContent='+'+n+' 💎'+(label?' '+label:'');
  const busy=document.querySelectorAll('.float').length;el.style.marginTop=(busy*34)+'px';
  document.body.appendChild(el);setTimeout(()=>el.remove(),1100);
}
const toastQ=[];let toastOn=false;
function toast(icon,title,name){toastQ.push([icon,title,name]);if(!toastOn)nextToast()}
function nextToast(){
  const t=toastQ.shift();if(!t){toastOn=false;return}toastOn=true;
  const el=document.createElement('div');el.className='toast';el.setAttribute('role','status');
  el.innerHTML='<span class="bi">'+t[0]+'</span><div><div class="tt">'+t[1]+'</div><div class="tn">'+esc(t[2])+'</div></div>';
  let done=false;const close=()=>{if(done)return;done=true;el.remove();nextToast()};
  el.onclick=close;document.body.appendChild(el);setTimeout(close,2200);
}
function checkAch(){
  ACH.forEach(a=>{if(!G.got.has(a.id)&&a.c()){G.got.add(a.id);G.coins+=25;toast(a.i,'Novo postignuće! +25 💎',a.n)}});
  hud();
}
function showAch(){
  if(hasSpeech)speechSynthesis.cancel();
  S=null;
  let h='<div class="card"><p class="big">🏆 Postignuća</p><p class="text">Otključano <b>'+G.got.size+' od '+ACH.length+'</b>. Svako donosi <b>+25 💎</b>.</p><p class="muted" style="margin-top:8px">Najduži niz: 🔥 '+G.bestStreak+' · Točnih odgovora: '+G.correct+' · Krugova: '+G.rounds+'</p></div><div class="ach">';
  ACH.forEach(a=>{const g=G.got.has(a.id);h+='<div class="ac '+(g?'got':'locked')+'"><span class="bi">'+a.i+'</span><div><div class="an">'+esc(a.n)+(g?' ✓':'')+'</div><div class="ad">'+esc(a.d)+'</div></div></div>'});
  h+='</div><button class="btn" onclick="home()">Natrag na razine</button>';
  view.innerHTML=h;scrollTo(0,0);
}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function strip(h){const d=document.createElement('div');d.innerHTML=h;return d.textContent}
/* ---------- govor ---------- */
let RATE=.9;
function voice(){const vs=hasSpeech?speechSynthesis.getVoices():[];return vs.find(v=>/^hr/i.test(v.lang))||vs.find(v=>/^(sr|bs)/i.test(v.lang))||null}
if(hasSpeech){speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>{}}
function sayable(t){return t
  .replace(/°C \(Celzijev stupanj\)/g,'Celzijev stupanj').replace(/\b1\s*g\b/g,'1 gram').replace(/°C/g,' Celzijevih stupnjeva').replace(/g\/cm³/g,' grama po kubnom centimetru')
  .replace(/(\d)\s*cm³/g,'$1 kubni centimetar').replace(/(\d)\s*dm³/g,'$1 kubni decimetar')
  .replace(/(\d)\s*mL\b/g,'$1 mililitar').replace(/(\d)\s*mg\b/g,'$1 miligrama').replace(/(\d)\s*kg\b/g,'$1 kilogram').replace(/(\d)\s*g\b/g,'$1 grama').replace(/(\d)\s*L\b/g,'$1 litra')
  .replace(/\s*=\s*/g,' je ').replace(/\s*→\s*/g,', u ').replace(/ρ/g,'ro').replace(/CO₂/g,'ugljikov dioksid').replace(/\(s\)/g,'').replace(/\(l\)/g,'').replace(/\(g\)/g,'')
  .replace(/…/g,', ').replace(/„|”/g,'')}
function utter(t,onend){const u=new SpeechSynthesisUtterance(sayable(t));u.lang='hr-HR';u.rate=RATE;const v=voice();if(v)u.voice=v;if(onend){u.onend=onend}return u}
function speak(t){if(!hasSpeech)return;speechSynthesis.cancel();speechSynthesis.speak(utter(t))}
function speakBtn(id){return hasSpeech?'<button class="speak" onclick="speak(document.getElementById(\''+id+'\').textContent)">🔊 Čitaj</button>':''}
function stars(n,max=3){return '★'.repeat(n)+'☆'.repeat(max-n)}

let fs=21;function fontSize(d){fs=Math.min(30,Math.max(16,fs+d*2));document.documentElement.style.setProperty('--fs',fs+'px')}
function toggleTheme(){const r=document.documentElement;r.dataset.theme=r.dataset.theme==='dark'?'light':'dark'}

/* ---------- početna ---------- */
function home(){
  if(hasSpeech)speechSynthesis.cancel();
  S=null;
  const total=Object.values(best).reduce((a,b)=>a+b,0),max=LEVELS.length*3;
  let h='<div class="card"><p class="big">Bok!</p><p class="text">Odaberi razinu. Svaka ima kratko <b>učenje</b> i samo <b>'+ROUND+' pitanja</b>.</p><p class="text" style="margin-top:10px">💎 Točan odgovor = <b>10 dijamanata</b><br>🔥 Svakih 5 zaredom = <b>bonus</b><br>🏆 Otključaj <b>postignuća</b><br>🎧 Lekciju možeš i <b>slušati</b></p><p class="muted" style="margin-top:10px">Zvjezdice: '+total+' / '+max+'</p></div><div class="levels">';
  LEVELS.forEach((L,i)=>{const b=best[i]||0;h+='<button class="lvl'+(b===3?' done':'')+'" onclick="startLevel('+i+')"><span class="n">'+(L.bonus?'★':i+1)+'</span><span class="t">'+esc(L.t)+'</span><span class="s" aria-label="'+b+' zvjezdice">'+stars(b)+'</span></button>'});
  h+='</div><button class="btn ghost" onclick="startMix()">Miješano: 8 pitanja iz svega</button>';
  view.innerHTML=h;scrollTo(0,0);
}

/* ---------- učenje (kartice) ---------- */
function startLevel(i){S={lvl:i,card:0};showCard()}
function showCard(){
  const L=LEVELS[S.lvl],c=S.card,n=L.cards.length;
  let dots='';for(let k=0;k<n;k++)dots+='<span class="dot'+(k<=c?' on':'')+'"></span>';
  view.innerHTML='<div class="pill">Razina '+(L.bonus?'bonus':S.lvl+1)+' · Učenje '+(c+1)+'/'+n+'</div>'+
  (c===0&&hasSpeech?'<button class="btn listen" onclick="audioLesson('+S.lvl+')">🎧 Slušaj cijelu lekciju</button>':'')+
  '<div class="card">'+speakBtn('ct')+'<p class="text" id="ct">'+L.cards[c]+'</p></div><div class="dots">'+dots+'</div>'+
  '<div class="row">'+(c>0?'<button class="btn ghost" onclick="S.card--;showCard()">← Natrag</button>':'')+
  '<button class="btn" onclick="'+(c<n-1?'S.card++;showCard()':'readDone()')+'">'+(c<n-1?'Dalje →':'Idemo na pitanja!')+'</button></div>'+
  (c===0?'<button class="btn ghost" onclick="startQuiz(LEVELS[S.lvl].qs)">Preskoči učenje</button>':'');
  scrollTo(0,0);
}

/* ---------- audio lekcija ---------- */
let AUD=0; // brojač da stari "onend" ne pokrene sljedeću karticu
function audioLesson(i){S={lvl:i,audio:true,card:0,playing:true,done:false};renderAudio();playCard()}
function renderAudio(){
  const L=LEVELS[S.lvl],c=S.card,n=L.cards.length;
  let dots='';for(let k=0;k<n;k++)dots+='<span class="dot'+(k<c||S.done?' ok':k===c?' on':'')+'"></span>';
  const v=voice();
  view.innerHTML='<div class="pill">Razina '+(L.bonus?'bonus':S.lvl+1)+' · 🎧 Audio lekcija · '+(c+1)+'/'+n+'</div>'+
  '<div class="card'+(S.playing?' playing':'')+'"><p class="muted" style="margin:0 0 8px">'+(S.done?'✓ Lekcija je gotova':S.playing?'🔊 Slušaš…':'⏸ Pauza')+'</p><p class="text">'+L.cards[c]+'</p></div>'+
  '<div class="dots">'+dots+'</div>'+
  '<div class="row"><button class="btn ghost" onclick="audioMove(-1)" aria-label="Prethodna" '+(c===0?'disabled':'')+'>⏮</button>'+
  '<button class="btn" onclick="audioToggle()">'+(S.playing?'⏸ Pauza':S.done?'↺ Ispočetka':'▶ Nastavi')+'</button>'+
  '<button class="btn ghost" onclick="audioMove(1)" aria-label="Sljedeća" '+(c===n-1?'disabled':'')+'>⏭</button></div>'+
  '<div class="row"><button class="btn ghost'+(RATE<.9?' sel':'')+'" onclick="setRate(.75)">🐢 Sporije</button><button class="btn ghost'+(RATE>=.9?' sel':'')+'" onclick="setRate(.9)">Normalno</button></div>'+
  '<button class="btn'+(S.done?'':' ghost')+'" onclick="audioStop();readDone()">Idemo na pitanja! →</button>'+
  (v?'':'<p class="muted" style="margin-top:14px">Na ovom računalu nema hrvatskoga glasa pa izgovor može biti čudan. Windows: Postavke → Vrijeme i jezik → Govor → Dodaj glasove → Hrvatski (Matej).</p>');
}
function playCard(){
  if(!hasSpeech)return;const my=++AUD;speechSynthesis.cancel();
  const L=LEVELS[S.lvl];let t=strip(L.cards[S.card]);if(S.card===0)t='Lekcija: '+L.t+'. '+t;
  const u=utter(t,()=>{if(my!==AUD||!S||!S.audio||!S.playing)return;
    if(S.card<L.cards.length-1){S.card++;renderAudio();setTimeout(()=>{if(my===AUD&&S&&S.audio&&S.playing)playCard()},800)}
    else{S.playing=false;S.done=true;renderAudio();if(!G.read.has(S.lvl)){G.read.add(S.lvl);addCoins(5,'za slušanje');checkAch()}}});
  speechSynthesis.speak(u);
}
function audioStop(){AUD++;if(hasSpeech)speechSynthesis.cancel();if(S)S.playing=false}
function audioToggle(){if(S.playing){audioStop();renderAudio()}else{if(S.done){S.card=0;S.done=false}S.playing=true;renderAudio();playCard()}}
function audioMove(d){const n=LEVELS[S.lvl].cards.length;S.card=Math.max(0,Math.min(n-1,S.card+d));S.done=false;if(S.playing){renderAudio();playCard()}else renderAudio()}
function setRate(r){RATE=r;if(S&&S.audio){if(S.playing){renderAudio();playCard()}else renderAudio()}}

function readDone(){
  if(!G.read.has(S.lvl)){G.read.add(S.lvl);addCoins(5,'za učenje');checkAch()}
  startQuiz(LEVELS[S.lvl].qs);
}
/* ---------- kviz ---------- */
function startMix(){S={lvl:-1,mix:true};startQuiz(LEVELS.filter(l=>!l.bonus).flatMap(l=>l.qs),8)}
function startQuiz(pool,count){
  const list=shuffle(pool).slice(0,count||ROUND);
  Object.assign(S,{list,i:0,ok:0,combo:0,res:[],retry:[],retrying:false});
  showQ();
}
function showQ(){
  const q=S.list[S.i];
  const opts=q.tf!==undefined?[{t:'Točno',ok:q.tf},{t:'Netočno',ok:!q.tf}]:shuffle(q.o.map((t,k)=>({t,ok:k===0})));
  S.opts=opts;S.answered=false;
  let dots='';S.list.forEach((_,k)=>{const r=S.res[k];dots+='<span class="dot'+(r===true?' ok':r===false?' bad':k===S.i?' on':'')+'"></span>'});
  let h='<div class="pill">'+(S.retrying?'Popravak · ':'')+'Pitanje '+(S.i+1)+' od '+S.list.length+(G.streak>=2?' <span class="combo">🔥 '+G.streak+' zaredom!</span>':'')+'</div>';
  h+='<div class="card">'+speakBtn('qt')+'<p class="big" id="qt">'+esc(q.q)+'</p>';
  opts.forEach((o,k)=>{h+='<button class="opt" data-k="'+k+'" onclick="answer('+k+')"><span class="k">'+KEYS[k]+'</span><span>'+esc(o.t)+'</span></button>'});
  h+='<div id="fb"></div></div><div class="dots">'+dots+'</div>';
  view.innerHTML=h;scrollTo(0,0);
}
function answer(k){
  if(S.answered)return;S.answered=true;
  const q=S.list[S.i],ok=S.opts[k].ok;
  document.querySelectorAll('.opt').forEach((b,j)=>{b.disabled=true;if(S.opts[j].ok)b.classList.add('right');else if(j===k)b.classList.add('wrong')});
  S.res[S.i]=ok;
  if(ok){
    S.ok++;G.correct++;G.streak++;G.bestStreak=Math.max(G.bestStreak,G.streak);
    if(S.retrying)G.fixed++;
    addCoins(S.retrying?5:10);
    if(G.streak%5===0)setTimeout(()=>{addCoins(G.streak>=10?50:25,'niz '+G.streak+'!');toast('🔥','Vatreni niz!',G.streak+' točnih zaredom')},350);
  }else{
    if(G.streak>=3)toast('💨','Niz se ugasio','Bilo je '+G.streak+' zaredom. Kreni ispočetka!');
    G.streak=0;if(!S.retrying)S.retry.push(q);
  }
  hud();checkAch();
  const right=S.opts.find(o=>o.ok).t;
  const praise=['Bravo!','Super!','Točno!','Odlično!','Tako je!'][Math.floor(Math.random()*5)];
  document.getElementById('fb').innerHTML='<div class="fb '+(ok?'ok':'bad')+'"><b>'+(ok?'✓ '+praise:'✗ Ne baš. Točno je: '+esc(right))+'</b><span class="ex">'+esc(q.e)+'</span></div><button class="btn" id="next" onclick="next()">'+(S.i<S.list.length-1?'Dalje →':'Gotovo')+'</button>';
  document.getElementById('next').focus({preventScroll:true});
  document.getElementById('next').scrollIntoView({behavior:'smooth',block:'nearest'});
}
function next(){
  if(hasSpeech)speechSynthesis.cancel();
  if(S.i<S.list.length-1){S.i++;showQ();return}
  if(!S.retrying&&S.retry.length){S.first={ok:S.ok,n:S.list.length};Object.assign(S,{list:shuffle(S.retry),i:0,res:[],retrying:true,combo:0});
    view.innerHTML='<div class="card center"><p class="big">Još samo malo!</p><p class="text">Ponovimo <b>'+S.list.length+'</b> '+(S.list.length===1?'pitanje koje je bilo krivo':'pitanja koja su bila kriva')+'.</p><button class="btn" onclick="showQ()">Idemo →</button></div>';return}
  finish();
}
function finish(){
  const f=S.first||{ok:S.ok,n:S.list.length};
  const pct=f.ok/f.n;const st=pct===1?3:pct>=.66?2:pct>=.34?1:0;
  if(S.lvl>=0){best[S.lvl]=Math.max(best[S.lvl]||0,st);G.played.add(S.lvl)}
  G.rounds++;if(S.mix)G.mix++;
  let bonus=20;if(st===3){bonus+=30;G.perfect++}
  setTimeout(()=>{addCoins(bonus,st===3?'savršen krug!':'krug završen');checkAch()},300);
  const msg=st===3?'Savršeno, bez ijedne greške!':st===2?'Jako dobro!':st===1?'Dobar početak. Probaj još jednom!':'Ne odustaj. Pročitaj kartice pa probaj opet!';
  view.innerHTML='<div class="card center"><p class="big">'+msg+'</p><div class="stars">'+stars(st)+'</div><p class="text">Iz prve točno: <b>'+f.ok+' od '+f.n+'</b></p></div>'+
  '<div class="card"><p class="big">Pauza za oči</p><p class="text">Pogledaj kroz prozor <b>nešto daleko</b> dok brojač ne dođe do nule.</p><div class="timer" id="tm">20</div></div>'+
  '<div class="row">'+(S.lvl>=0?'<button class="btn ghost" onclick="startLevel('+S.lvl+')">Ponovi razinu</button>':'')+'<button class="btn" onclick="home()">Na popis razina</button></div>';
  let t=20;const id=setInterval(()=>{t--;const el=document.getElementById('tm');if(!el){clearInterval(id);return}el.textContent=t>0?t:'Gotovo ✓';if(t<=0)clearInterval(id)},1000);
  scrollTo(0,0);
}
/* tipkovnica: A–D ili 1–4 za odgovor, Enter za dalje */
document.addEventListener('keydown',e=>{
  if(!S||!S.list)return;
  const m={a:0,b:1,c:2,d:3,'1':0,'2':1,'3':2,'4':3}[e.key.toLowerCase()];
  if(m!==undefined&&!S.answered&&S.opts&&m<S.opts.length){answer(m);e.preventDefault()}
  else if(e.key==='Enter'&&S.answered){const n=document.getElementById('next');if(n){n.click();e.preventDefault()}}
});
hud();home();
</script>
</body>
</html>
